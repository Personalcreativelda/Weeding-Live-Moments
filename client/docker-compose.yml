services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from client/.env (docker compose loads it automatically because
        # it's a file named ".env" next to this compose file).
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      # Host port — change WEB_PORT in client/.env if 18080 also clashes
      # with something else on the VPS. Container always listens on 80.
      - "${WEB_PORT:-18080}:80"
